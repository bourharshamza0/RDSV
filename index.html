<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>réclamation Dsv</title>
    <style>
/* ===== 1. التنسيق العام ===== */
.dashboard {
    display: flex;
    gap: 20px;
    height: calc(100vh - 30px);
    padding: 15px;
    width: 100%;
    max-width: 100% !important;
    margin: 0;
    box-sizing: border-box;
    overflow: hidden;
}

/* ===== 2. تقسيم اللوحة الرئيسية ===== */
.main-panel {
    flex: 1;
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr); 
    grid-template-areas: "form table";
    gap: 20px;
    width: 100%;
    height: 100%;
}

.form-panel {
    grid-area: form;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 20px;
    width: 100%;
    box-sizing: border-box;
    overflow-y: auto;
}

.table-panel {
    grid-area: table;
    min-width: 0;
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* يمنع تسرب النصوص خارج كارت الجدول */
}

/* ===== 3. رأس وهيكل حاوية الجدول ===== */
.table-header {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    padding: 15px 20px;
    border-bottom: 2px solid #dee2e6;
    flex-shrink: 0;
}

.table-header h2 {
    color: #2c3e50;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
}

.table-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* القفل الخارجي لمنع التداخل */
    padding: 15px;
}

/* ===== 4. حل مشكلة الجدول والتمرير داخل tbody حصرياً ===== */
.data-table {
    width: 100%;
    border-collapse: collapse;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.data-table thead {
    display: table;
    width: 100%;
    table-layout: fixed;
    background: linear-gradient(135deg, #4a6fa5, #2c3e50);
    color: white;
    flex-shrink: 0;
}

.data-table tbody {
    display: block;
    flex: 1;
    overflow-y: auto; /* التمرير يعمل فقط هنا داخل أسطر الجدول */
    overflow-x: hidden;
    width: 100%;
}

.data-table tbody tr {
    display: table;
    width: 100%;
    table-layout: fixed;
    cursor: pointer !important;
    transition: background-color 0.2s ease;
}

.data-table th {
    padding: 12px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
}

.data-table td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #e9ecef;
    font-size: 13px;
    word-break: break-word;
    background-color: white;
}

.data-table tbody tr:hover td {
    background-color: #f1f5f9 !important;
}

/* تخصيص شكل شريط التمرير للـ tbody والنموذج */
.data-table tbody::-webkit-scrollbar,
.form-panel::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.data-table tbody::-webkit-scrollbar-track,
.form-panel::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
}

.data-table tbody::-webkit-scrollbar-thumb,
.form-panel::-webkit-scrollbar-thumb {
    background: #a8b8d0;
    border-radius: 4px;
}

.data-table tbody::-webkit-scrollbar-thumb:hover,
.form-panel::-webkit-scrollbar-thumb:hover {
    background: #4a6fa5;
}

/* ===== 5. حقول النموذج والأزرار ===== */
.form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #f8f9fa;
}

.form-header h2 {
    color: #2c3e50;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.form-label {
    margin-bottom: 6px;
    font-weight: 600;
    color: #2c3e50;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.form-label .lang {
    font-size: 11px;
    color: #6c757d;
    margin-right: 5px;
}

.form-input {
    padding: 10px 12px;
    border: 2px solid #dee2e6;
    border-radius: 8px;
    font-size: 14px;
    background: #f8f9fa;
    transition: all 0.3s;
    width: 100%;
    box-sizing: border-box;
}

.form-input:focus {
    outline: none;
    border-color: #4a6fa5;
    background: white;
    box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
}

#module {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #f9f9f9;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.3s;
    box-sizing: border-box;
}

#module:focus {
    border-color: #4a6fa5;
    outline: none;
    background-color: #fff;
}

.control-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.control-btn {
    flex: 1;
    padding: 12px 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer !important;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn-primary {
    background: linear-gradient(135deg, #4a6fa5, #2c3e50);
    color: white;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #3a5a95, #1c2e40);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(74, 111, 165, 0.4);
}

.btn-secondary {
    background: #6c757d;
    color: white;
}

.btn-secondary:hover {
    background: #5a6268;
    transform: translateY(-2px);
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.btn-danger:hover {
    background: #c82333;
    transform: translateY(-2px);
}

/* ===== 6. التنبيهات وشاشة التحميل ===== */
.selected-template-panel {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    border-radius: 12px;
    padding: 15px;
    border: 2px solid #4a6fa5;
    margin-bottom: 15px;
}

.selected-template-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.selected-template-header h3 {
    color: #2c3e50;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.template-preview {
    background: white;
    padding: 12px;
    border-radius: 8px;
    border-left: 4px solid #28a745;
    margin-top: 8px;
}

.template-preview p {
    margin: 8px 0;
    color: #495057;
    line-height: 1.5;
}

.alert {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 25px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    z-index: 1000;
    animation: slideIn 0.3s ease-out;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    display: none;
}

.alert.show { display: block; }
.alert-success { background: linear-gradient(135deg, #28a745, #218838); }
.alert-error { background: linear-gradient(135deg, #dc3545, #c82333); }
.alert-info { background: linear-gradient(135deg, #17a2b8, #138496); }

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    flex-direction: column;
}

.loading-overlay.active { display: flex; }

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #4a6fa5;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.no-templates {
    text-align: center;
    padding: 30px 15px;
    color: #6c757d;
}

.no-templates i {
    font-size: 40px;
    margin-bottom: 10px;
    display: block;
    color: #dee2e6;
}

/* ===== 7. التجاوب مع الشاشات الصغيرة ===== */
@media (max-width: 1100px) {
    .dashboard {
        height: auto;
        overflow: visible;
    }

    .main-panel {
        grid-template-columns: 1fr;
        grid-template-areas: 
            "form"
            "table";
        height: auto;
    }

    .control-buttons {
        flex-direction: column;
    }
}
    </style>
</head>
<body>
    <div class="dashboard">       
        <!-- اللوحة الرئيسية -->
        <div class="main-panel">
            <!-- قسم إدخال البيانات -->
            <div class="form-panel">
                <div class="form-header">
                    <h2>📝 أدخل بيانات الرسالة</h2>
                    <div class="form-stats">

                    </div>
                </div>
                
                <form id="letter-form" method="POST" 
                      action="https://script.google.com/macros/s/AKfycbxXqeUQpIzMKydQTc1i8sw9A_RT-LHgsVuPpOBowCt6GZdMa1av7h2pVo5T7WM3el4y/exec">
                    <div class="form-grid">
                        <!-- الصف الأول -->

                        <div class="form-group">
                            <label class="form-label">
                                <span>👤 المستلم</span>
                                <span class="lang">/ Destinataire</span>
                            </label>
                            
                            <select class="form-input" id="destinataire" name="destinataire" required>
                                <option value="" disabled selected>-- اختر المستلم / Choisissez --</option>
                                <option value=""></option>
                                <option value="السيد(ة)">السيد(ة)</option>
                                <option value="الاستاذ(ة)">الاستاذ(ة)</option>
                                <option value="الممثل القانوني للشركة">الممثل القانوني للشركة</option>
                            </select>
                        </div>                        
                        
                        <div class="form-group">
                            <label class="form-label">
                                <span>📌 الموضوع</span>
                                <span class="lang">/ Objet</span>
                            </label>
                            <input type="text" class="form-input" id="objet" name="objet" 
                                   placeholder="أدخل موضوع الرسالة..." required>
                        </div>
                        
                        <!-- الصف الثاني -->
                        <div class="form-group">
                            <label class="form-label">
                                <span>👤 الاسم</span>
                                <span class="lang">/ Nom</span>
                            </label>
                            <input type="text" class="form-input" id="nom" name="nom" 
                                   placeholder="أدخل الاسم الكامل..." required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <span>📍 العنوان</span>
                                <span class="lang">/ Adresse</span>
                            </label>
                            <input type="text" class="form-input" id="adresse" name="adresse" 
                                   placeholder="أدخل العنوان الكامل..." required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                <span>🏙️ المدينة</span>
                                <span class="lang">/ Ville</span>
                            </label>
                            <select class="form-input" id="ville" name="ville" required>
                                <option value="" disabled selected>-- اختر المدينة / Choisissez --</option>
                                <option value="طنجة">طنجة</option>
                                <option value="أصيلة">أصيلة</option>
                            </select>
                        </div>
                        
                        <!-- الصف الثالث -->
                        <div class="form-group">
                            <label class="form-label">
                                <span>🔖 المرجع</span>
                                <span class="lang">/ Référence</span>
                            </label>
                            <input type="text" class="form-input" id="demande" name="demande" 
                                   placeholder="أدخل رقم المرجع..." required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <span>📅 التاريخ</span>
                                <span class="lang">/ Date</span>
                            </label>
                            <input type="date" class="form-input" id="date" name="date" required>
                        </div>

                        <div class="form-group">
                            <label for="module">اختر نوع المراسلة:</label>
                            <select id="module" class="form-control" onchange="System.onTemplateChange()">
                                <option value="">-- اختر قالباً من القائمة --</option>
                                </select>
                        </div>

                    </div>


                    
                    
                    <!-- أزرار التحكم -->
                    <div class="control-buttons">
                        <button type="button" class="control-btn btn-primary" onclick="createLetter()">
                            🚀 إنشاء الرسالة
                        </button>
                        <button type="button" class="control-btn btn-secondary" onclick="searchData()">
                            🔍 بحث في السجلات
                        </button>
                        <button type="button" class="control-btn btn-danger" onclick="clearForm()">
                            🗑️ مسح النموذج
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- قسم عرض البيانات -->
            <div class="table-panel">
                <div class="table-header">
                    <h2>🗃️ السجلات المحفوظة</h2>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>📌 module</th>
                                <th>📅 Date</th>
                                <th>🔖 Demande</th>
                                <th>🏙️ Ville</th>
                                <th>📍 Adresse</th>
                                <th>👤 Nom</th>
                                <th>📌 Objet</th>
                                <th>👤 réclamant</th>
                            </tr>
                        </thead>
                        <tbody id="data-table-body">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px;">
                                    <div style="color: #6c757d;">
                                        <div style="font-size: 48px; margin-bottom: 10px;">📊</div>
                                        <p>جاري تحميل البيانات...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- رسائل التنبيه -->
    <div class="alert" id="alert"></div>
    
    <!-- شاشة التحميل -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #4a6fa5; font-weight: 600;">جاري المعالجة...</p>
    </div>
    
    <!-- مكتبات خارجية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- ملفات المشروع -->
    <script src="script.js"></script>

    <script src="data.js"></script>

</body>
</html>
